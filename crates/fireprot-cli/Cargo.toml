[package]
name = "fireprot-cli"
description = "Rust command-line entry point for FireProt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true

[[bin]]
name = "fireprot"
path = "src/main.rs"

[dependencies]
fireprot-core = { path = "../fireprot-core" }
fireprot-runtime = { path = "../fireprot-runtime" }
